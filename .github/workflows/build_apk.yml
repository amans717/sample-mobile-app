name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Backup custom native configuration
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/example/crm_call_sample/MainActivity.kt /tmp/backup/MainActivity.kt
          cp android/build.gradle /tmp/backup/build.gradle

      - name: Generate complete Android scaffolding & Gradle wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example --project-name=crm_call_sample
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/crm_call_sample
          cp /tmp/backup/MainActivity.kt android/app/src/main/kotlin/com/example/crm_call_sample/MainActivity.kt

      - name: Inject AGP 8 namespace fallback & configure build.gradle
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group.toString() != 'unspecified' && project.group.toString().isNotEmpty() ? project.group.toString() : "com.example.${project.name.replaceAll('-', '.')}"
                          }
                      }
                  }
              }
          }
          EOF

          python3 -c "
          import re, os
          gradle_file = 'android/app/build.gradle'
          if os.path.exists(gradle_file):
              content = open(gradle_file).read()
              content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', content)
              content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', content)
              content = re.sub(r'minSdk\s*=\s*flutter\.minSdk', 'minSdk = 24', content)
              
              if 'coreLibraryDesugaring' not in content:
                  content = content.replace(
                      'dependencies {',
                      'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"'
                  )
                  content = content.replace(
                      'compileOptions {',
                      'compileOptions {\n        coreLibraryDesugaringEnabled true'
                  )
              open(gradle_file, 'w').write(content)
          " || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release --verbose > build.log 2>&1 || {
            echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Call-Sample-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
