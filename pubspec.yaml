name: crm_call_sample
description: "A production-ready Android CRM sample app with Supabase, SQLite contact caching, call lifecycle handling, and recording uploads."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  just_audio: ^0.9.40
  record: ^5.1.2
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
